name: CI Artifact Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ] # "develop" qo'shildi!
jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out source code
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build Docker Image
      run: |
        docker build -t ghcr.io/${{ github.repository_owner }}/rabola-todo-app:${{ github.sha }} .
        docker tag ghcr.io/${{ github.repository_owner }}/rabola-todo-app:${{ github.sha }} ghcr.io/${{ github.repository_owner }}/rabola-todo-app:latest

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'ghcr.io/${{ github.repository_owner }}/rabola-todo-app:${{ github.sha }}'
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'

    - name: Push Artifact to GHCR
      run: |
        docker push ghcr.io/${{ github.repository_owner }}/rabola-todo-app:${{ github.sha }}
        docker push ghcr.io/${{ github.repository_owner }}/rabola-todo-app:latest
